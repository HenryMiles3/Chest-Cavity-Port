plugins {
	id 'fabric-loom' version '1.14-SNAPSHOT'
	id 'maven-publish'
}

// Minecraft 1.20.5 and later use Java 21.
java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
	maven {
		url = "https://maven.modmuss50.me/"
	}
	maven { url = 'https://jitpack.io'
		content{
			excludeGroup 'io.github.ladysnake'
		}
	} //good 'ol jitpack
	maven { url = 'https://maven.terraformersmc.com/releases/' } //for mod menu
	maven { url "https://maven.shedaniel.me/" } //for cloth config and rei
}

configurations.all {
	resolutionStrategy {
		force("net.fabricmc:fabric-loader:$loader_version")
	}
}

dependencies {
	//to change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
	// You may need to force-disable transitiveness on them.

	// Replace modImplementation with modApi if you expose components in your own API

	// TODO: this is a 1.19-era library. It almost certainly has no 1.21.11 build and will need
	// to be forked and ported (or its few features moved into this mod).
	modApi ("com.github.tigereye504:modify-drops-api:v0.5.0") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modImplementation ("com.terraformersmc:modmenu:${project.mod_menus_version}"){
		exclude(group: "net.fabricmc.fabric-api")
	}

	modCompileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"){
		exclude group: "net.fabricmc", module: "fabric-loader"
		exclude group: "dev.architectury", module: "architectury"
	}
	modCompileOnly ("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"){
		exclude group: "net.fabricmc", module: "fabric-loader"
	}

	// Jar-in-Jar dependencies
	include ("com.github.tigereye504:modify-drops-api:v0.5.0") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << "-Xmaxerrs" << "2000"
}